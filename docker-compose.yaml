services:
  inventory:
    build: 
      context: ./inventory-service
    container_name: ticketflow-inventory
    ports:
      - "8082:8081"
    environment:
      - DB_DSN=app:app@tcp(mysql:3306)/ticketflow_inventory?parseTime=true
      - PORT=8081
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - ticketflow-network

  reservation:
    build: 
      context: ./reservation-service
    container_name: ticketflow-reservation
    ports:
      - "8080:8081"
    environment:
      - DB_DSN=app:app@tcp(mysql:3306)/ticketflow_reservation?parseTime=true
      - INVENTORY_URL=http://inventory:8081
      - PORT=8081
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - ticketflow-network

  mysql:
    image: mysql:8.0
    container_name: ticketflow-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: app
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ticketflow-network

networks:
  ticketflow-network:
    driver: bridge

volumes:
  mysql_data:
